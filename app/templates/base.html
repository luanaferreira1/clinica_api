<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Clínica Segura{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f3f6f9;
        color: #17212b;
      }
      body { margin: 0; }
      header { background: #0b496a; color: white; padding: 1.25rem 2rem; }
      header p { margin-bottom: 0; opacity: 0.85; }
      main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
      .card { background: white; border-radius: 0.75rem; padding: 1.5rem; box-shadow: 0 3px 14px #1632471a; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 0.8rem; border-bottom: 1px solid #d9e1e7; text-align: left; vertical-align: top; }
      th { color: #0b496a; }
      .vazio { color: #596772; }
    </style>
  </head>
  <body>
    <header>
      <strong>Clínica Segura</strong>
      <p>Área interna da recepção</p>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
